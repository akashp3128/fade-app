name: fade_app
description: "Fade - Connect with barbers near you"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend - Supabase
  supabase_flutter: ^2.8.4

  # Payments
  flutter_stripe: ^11.3.0

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # UI Components
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.0.16
  smooth_page_indicator: ^1.2.0+3

  # Forms & Validation
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.1.0

  # Utilities
  intl: any
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.3
  uuid: ^4.5.1

  # Navigation
  go_router: ^14.8.1
  http: ^1.6.0
  video_player: ^2.10.1
  chewie: ^1.13.0
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  # Assets - google_fonts handles Poppins dynamically
  # Add local assets when needed:
  # assets:
  #   - assets/images/
  #   - assets/icons/
